name: Python tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Test
        run: python -m pytest -q
  failure-report:
    name: Collect complete build failure report
    if: ${{ failure() }}
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Create downloadable failure bundle
        uses: ./.github/actions/failure-bundle

