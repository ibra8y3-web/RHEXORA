name: Security analysis

on:
  push:
  pull_request:
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
jobs:
  python-security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install project runtime dependencies
        run: python -m pip install -e .
      - name: Audit project dependency graph
        run: |
          python -m pip install pip-audit
          pip-audit --local
      - name: Static Python security checks
        run: |
          python -m pip install bandit
          bandit -q -r src -lll

  codeql:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            build-mode: none
          - language: java-kotlin
            build-mode: manual
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java for Android analysis
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK for Kotlin analysis
        if: matrix.language == 'java-kotlin'
        uses: android-actions/setup-android@v3
        with:
          packages: ''
      - name: Install Android SDK platform
        if: matrix.language == 'java-kotlin'
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        if: matrix.language == 'java-kotlin'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended
      - name: Build Android Kotlin sources for CodeQL
        if: matrix.language == 'java-kotlin'
        working-directory: android
        run: gradle --no-daemon compileDebugKotlin
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
  failure-report:
    name: Collect complete build failure report
    if: ${{ failure() }}
    needs: [python-security, codeql]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Create downloadable failure bundle
        uses: ./.github/actions/failure-bundle

