name: Supply-chain and repository security checks

on:
  push:
  pull_request:
  schedule:
    - cron: '17 5 * * 3'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: '1'

  scorecard:
    # Optional until the repository owner enables access to the scorecard image in GCR.
    if: github.event_name != 'pull_request' && vars.RHEXORA_SCORECARD_ENABLED == 'true'
    runs-on: ubuntu-latest
    # Set RHEXORA_SCORECARD_ENABLED=true after GCR access is configured.
    continue-on-error: true
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: ossf/scorecard-action@v2.4.0
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: scorecard.sarif
  failure-report:
    name: Collect complete build failure report
    if: ${{ failure() }}
    needs: [gitleaks, trivy, scorecard]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Create downloadable failure bundle
        uses: ./.github/actions/failure-bundle
