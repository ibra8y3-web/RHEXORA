name: Public network smoke tests

on:
  workflow_dispatch:
  schedule:
    - cron: '41 3 * * 2'

permissions:
  contents: read
  actions: read
jobs:
  public-network:
    # Manual runs always execute; the scheduled probe stays dormant until the
    # repository owner has deployed and configured public infrastructure.
    if: ${{ github.event_name == 'workflow_dispatch' || vars.RHEXORA_PUBLIC_NETWORK_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install optional ICE transport
        run: python -m pip install -e '.[ice]'
      - name: Probe operator-configured public nodes
        env:
          RHEXORA_STUN_SERVER: ${{ vars.RHEXORA_STUN_SERVER }}
          RHEXORA_STUN_PORT: ${{ vars.RHEXORA_STUN_PORT }}
          RHEXORA_DHT_BOOTSTRAP: ${{ vars.RHEXORA_DHT_BOOTSTRAP }}
          RHEXORA_PUBLIC_RELAY_HOST: ${{ vars.RHEXORA_PUBLIC_RELAY_HOST }}
          RHEXORA_PUBLIC_RELAY_PORT: ${{ vars.RHEXORA_PUBLIC_RELAY_PORT }}
          RHEXORA_PUBLIC_ICE_INVITE_B64: ${{ secrets.RHEXORA_PUBLIC_ICE_INVITE_B64 }}
          RHEXORA_ICE_STUN: ${{ vars.RHEXORA_ICE_STUN || 'stun:stun.l.google.com:19302' }}
          RHEXORA_ICE_TURN_URL: ${{ vars.RHEXORA_ICE_TURN_URL }}
          RHEXORA_ICE_TURN_SHARED_SECRET: ${{ secrets.RHEXORA_ICE_TURN_SHARED_SECRET }}
        run: python scripts/public_network_smoke.py --strict
  failure-report:
    name: Collect complete build failure report
    if: ${{ failure() }}
    needs: [public-network]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
      - name: Create downloadable failure bundle
        uses: ./.github/actions/failure-bundle

