name: Android build and unit tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build and test Android sources
        working-directory: android
        run: gradle --no-daemon testDebugUnitTest assembleDebug assembleRelease
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: rhexora-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: rhexora-android-release-unsigned
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
  failure-report:
    name: Collect complete build failure report
    if: ${{ failure() }}
    needs: [assemble]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
      - name: Create downloadable failure bundle
        uses: ./.github/actions/failure-bundle

